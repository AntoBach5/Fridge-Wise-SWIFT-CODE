# project.yml — definición para XcodeGen.
#
# El .xcodeproj del repo usa grupos sincronizados con el sistema de archivos
# (Xcode 16+): añades un .swift a la carpeta y entra solo al target, sin
# tocar el proyecto ni generar conflictos de merge en project.pbxproj.
#
# Si prefieres regenerar el proyecto desde cero, o si tu Xcode es anterior a 16:
#
#   brew install xcodegen
#   xcodegen generate
#
# Docs: https://github.com/yonaskolb/XcodeGen

name: FridgeWise
options:
  bundleIdPrefix: app.fridgewise
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  FluidGradient:
    url: https://github.com/Cindori/FluidGradient
    majorVersion: 1.0.0
  SwiftUIIntrospect:
    url: https://github.com/siteline/swiftui-introspect
    majorVersion: 1.3.0
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios
    majorVersion: 6.0.0

targets:
  FridgeWise:
    type: application
    platform: iOS
    sources:
      - path: FridgeWise
    dependencies:
      - package: FluidGradient
        product: FluidGradient
      - package: SwiftUIIntrospect
        product: SwiftUIIntrospect
      - package: RiveRuntime
        product: RiveRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fridgewise.FridgeWise
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fridge Wise
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        # Los textos de permiso explican el uso REAL. Un texto genérico
        # ("necesitamos la cámara") es rechazo por Guideline 5.1.1.
        INFOPLIST_KEY_NSCameraUsageDescription: >-
          Fridge Wise usa la cámara para fotografiar el interior de tu nevera y
          reconocer qué ingredientes tienes. La foto se analiza y se descarta: no
          se guarda ni se comparte.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: >-
          Elige una foto de tu nevera desde tu fototeca para reconocer
          ingredientes sin sacar una nueva.
        INFOPLIST_KEY_NSUserTrackingUsageDescription: >-
          Con tu permiso mostramos publicidad más relevante en la versión
          gratuita. La app funciona igual si dices que no.
